<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>日光・宇都宮 — 三日自駕手札</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">

<style>
:root{
 --paper:#eae9e3;--card:#f4f3ee;--ink:#202521;--muted:#5c645e;--line:#c3c8bf;
 --green:#4f6453;--rust:#9a5531;--rust-tint:#efe1d6;--rust-soft:#e39a71;
 --on-ink:#f4f3ee;--on-ink-muted:#a9b1aa;
 --header:56px;--nav:64px;
 --mono:'DM Mono',ui-monospace,monospace;--sans:'Noto Sans TC',-apple-system,'PingFang TC',sans-serif;--display:'Archivo','Noto Sans TC',sans-serif;
 --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--line) var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;caret-color:var(--rust)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
::selection{background:var(--rust);color:#fff}
:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.topline{height:4px;background:var(--ink)}
header{position:sticky;top:0;z-index:40;height:var(--header);background:var(--paper);border-bottom:1px solid var(--ink)}
.head{height:100%;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center}.brand img{display:block;height:clamp(17px,5.4vw,24px);width:auto}.when{white-space:nowrap}
.head .when{margin-left:auto;font-size:12px;color:var(--muted)}
.topnav{display:none}

/* pages */
.page{display:none;padding:24px 0 calc(var(--nav) + 40px + env(safe-area-inset-bottom))}
.page.active{display:block;animation:enter .25s var(--ease)}
@keyframes enter{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0;letter-spacing:-.02em;text-wrap:balance}
.pagehead{margin:0 0 22px}
.pagehead h1{font-size:30px;line-height:1.25;font-weight:900}
.pagehead p{margin:6px 0 0;color:var(--muted);font-size:14px}
.dot{color:var(--rust)}

/* cover photo */
.cover{position:relative;margin:-24px -18px 0;height:min(76svh,620px);overflow:hidden;background:#3a3f36}
.cover-img{width:100%;height:100%;object-fit:cover;object-position:50% 60%;display:block}
.cover:after{content:'';position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(to top,rgba(18,22,19,.72),rgba(18,22,19,0));pointer-events:none}
.cover-txt{position:absolute;left:18px;right:18px;bottom:22px;z-index:1;color:#fff}
.cover-txt h1{font-size:52px;line-height:1.08;font-weight:900;letter-spacing:.02em}
.cover-txt p{margin:10px 0 0;font-size:14px;color:rgba(255,255,255,.86)}

/* lead (status) */
.lead{padding:26px 0 4px}
.lead h2{font-size:26px;line-height:1.4;font-weight:900}
.lead h2 .num{font-size:40px;font-weight:500;color:var(--rust);letter-spacing:-.04em}
.lead p{margin:6px 0 0;color:var(--muted);font-size:14px}
.lead .state{font-size:13px;font-weight:700;color:var(--rust);margin-bottom:4px}
.lead .btnrow{margin-top:16px}
.meter{height:4px;background:var(--line);margin:14px 0 6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);transition:width .25s var(--ease)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border:1px solid var(--ink);background:transparent;font-size:15px;font-weight:700;transition:background .15s,color .15s,border-color .15s}
.btn:active{transform:translateY(1px)}
.btn.dark{background:var(--ink);color:var(--on-ink)}
.btn.accent{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.ghost{border-color:var(--line);background:transparent}
.btn.danger{color:#8e3f22;border-color:#c99a85}
.btn.block{width:100%}
@media(hover:hover){.btn.dark:hover{background:#3a423c}.btn.accent:hover{background:#7f4426}.btn.ghost:hover{border-color:var(--ink)}}
.btnrow{display:flex;gap:8px}.btnrow .btn{flex:1}

/* sections */
.section{margin-top:36px}
.section > h2{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;padding-bottom:8px;border-bottom:1px solid var(--ink);display:flex;align-items:baseline;gap:8px}
.count{color:var(--rust)}
.more{display:flex;align-items:center;gap:6px;background:none;border:0;padding:14px 0;font-size:14px;font-weight:700}
.dmeta{font-size:12px;font-weight:700;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--on-ink);background:var(--ink);padding:0 6px;margin-left:6px;vertical-align:1px}
.tag.now{background:var(--rust);color:#fff;margin:0 0 6px}

.dayrow{display:grid;grid-template-columns:76px 1fr 18px;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.thumb{width:76px;height:96px;object-fit:cover;display:block;background:var(--line)}
.dayrow h3{font-size:18px;line-height:1.4;margin:2px 0}
.dayrow p{margin:0;font-size:13px;color:var(--muted)}
.dayrow .ico{color:var(--muted)}
@media(hover:hover){.dayrow:hover h3{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}}

.hotel h3{font-size:18px;line-height:1.4;margin-top:14px}
.hotel p{margin:2px 0 14px;font-size:13px;color:var(--muted)}

/* route */
.tabs{position:sticky;top:var(--header);z-index:20;background:var(--paper);display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--ink);margin:-24px -18px 0;padding:0 18px}
.tab{background:none;border:0;padding:12px 4px 10px;text-align:center;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab b{display:block;font-size:20px;line-height:1.15;font-weight:500}
.tab span{font-size:12px;font-weight:700}
.tab.active{color:var(--ink);border-color:var(--ink)}
.dayhero{position:relative;margin:0 -18px;height:240px;overflow:hidden;background:#3a3f36}
.dayhero-img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;display:block}
.dayhero:after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(18,22,19,.7),rgba(18,22,19,0) 65%)}
.dayhero-txt{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;color:#fff}
.dayhero-txt .dmeta{color:rgba(255,255,255,.85)}
.dayhero-txt h2{font-size:26px;line-height:1.35;font-weight:900;margin-top:2px}
.daydesc{margin:16px 0 0;color:var(--muted);font-size:14px}
.dayprog{font-size:12px;color:var(--muted)}

.rmap{margin:14px 0 4px}
.rmap svg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;font-family:var(--sans)}
.rmap .mdate{font-family:var(--mono);font-size:11px;font-weight:500;font-variant-numeric:tabular-nums}
.rmap figcaption{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:6px}
.mchips{display:flex;gap:6px}
.mchip{font:500 13px var(--mono);font-variant-numeric:tabular-nums;min-height:36px;padding:0 12px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.mchip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
@media(hover:hover){.mchip:hover{border-color:var(--ink)}}
.rmap .rnote{margin-left:auto;font-size:11px;color:var(--muted)}
.timeline{margin:18px 0 0;list-style:none;padding:0;border-top:1px solid var(--ink)}
.leg{display:flex;align-items:center;gap:10px;padding:10px 0 10px 18px;font-size:13px;color:var(--muted);border-bottom:1px dashed var(--line)}
.leg b{color:var(--ink);font-weight:700}
.stop{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:16px 0 18px;border-bottom:1px solid var(--line)}
.stime{padding-top:2px}
.stime b{display:block;font-size:17px;line-height:1.2;font-weight:500}
.stime span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.sbody{transition:opacity .2s}
.stop.done .sbody,.stop.done .stime{opacity:.5}
.stop.done h3{text-decoration:line-through;text-decoration-thickness:1px}
.stop.now .stime b{color:var(--rust)}
.sbody h3{font-size:18px;line-height:1.45;margin-bottom:6px}
.detail{margin:8px 0 0;font-size:14px;line-height:1.8;color:#4d554f;overflow-wrap:anywhere;cursor:pointer}
.detail.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.alert{margin-top:4px;background:#e2e0d6;padding:9px 11px;font-size:13px;line-height:1.75;display:flex;gap:8px;color:var(--ink)}
.alert .ico{margin-top:3px;width:16px;height:16px}
.sact{display:flex;gap:8px;margin-top:12px}
.sact .btn{min-height:44px;font-size:14px}
.sact .go{flex:1}
.sact .chk{width:100px;flex:none}
.chk[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.endnote{margin-top:16px}

/* checklist */
.checkrow{display:flex;gap:14px;align-items:flex-start;padding:16px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px;line-height:1.65}
.checkrow input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:1.5px solid var(--ink);flex:none;margin:1px 0 0;background:var(--card);display:grid;place-items:center;cursor:pointer}
.checkrow input:checked{background:var(--green);border-color:var(--green)}
.checkrow input:checked:after{content:'';width:10px;height:6px;border:solid #fff;border-width:0 0 2px 2px;transform:translateY(-2px) rotate(-45deg)}
.checkrow:has(input:checked) .txt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.help{font-size:13px;color:var(--muted);margin:10px 0 0}

/* ledger */
.total{font-size:44px;line-height:1.1;font-weight:500;letter-spacing:-.05em;margin:0 0 10px}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.cat{font-size:12px;border:1px solid var(--line);padding:3px 8px;background:var(--card)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 6px;margin:0 -6px;border:0;border-bottom:1px solid var(--line);font-size:15px;width:calc(100% + 12px);background:none;text-align:left}
@media(hover:hover){.row:hover{background:var(--card)}}
.row .l{flex:1}
.row small{display:block;font-size:12px;color:var(--muted)}
.note{background:var(--card);border:1px solid var(--line);padding:14px;margin-top:10px;white-space:pre-wrap;font-size:15px;line-height:1.85;text-align:left;width:100%;display:block}
@media(hover:hover){.note:hover{border-color:var(--ink)}}
.note small{display:block;font-size:12px;color:var(--muted);margin-top:8px}
.empty{padding:18px 0;color:var(--muted);font-size:14px}
.stack{display:grid;gap:8px;margin-top:14px}

/* inline form */
.form{border:1px solid var(--ink);background:var(--card);padding:16px;margin:0 0 8px}
.form[hidden]{display:none}
.form h3{font-size:16px;margin-bottom:12px}
.fl{display:block;font-size:13px;font-weight:700;margin-bottom:12px}
.field{display:block;width:100%;background:#fff;border:1px solid var(--line);padding:11px 12px;border-radius:0;font-size:16px;font-weight:400;outline:0;margin-top:6px}
.field:focus{border-color:var(--rust);box-shadow:0 0 0 3px var(--rust-tint)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:45;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--paper);border-top:1px solid var(--ink);display:grid;grid-template-columns:repeat(4,1fr)}
body:not([data-phase=pre]) .bnav{grid-template-columns:repeat(3,1fr)}
body:not([data-phase=pre]) [data-page=check]{display:none}
.bnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.bnav .ico{width:22px;height:22px;stroke-width:1.6}
.bnav button.active{color:var(--rust)}

footer{border-top:1px solid var(--ink);padding:22px 0 calc(var(--nav) + 30px + env(safe-area-inset-bottom))}
footer .lockup{display:block;width:100%;max-width:466px;height:auto;margin-left:-14px}

.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom));z-index:120;background:var(--ink);color:#fff;padding:12px 16px;font-size:14px;box-shadow:0 8px 24px rgba(20,25,21,.25);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);max-width:420px;margin:0 auto}
.toast.show{opacity:1;transform:none}

@media(min-width:860px){
 :root{--header:64px}
 .wrap{padding:0 28px}
 .head .when{margin-left:20px}
 .topnav{display:flex;margin-left:auto;height:100%}
 .topnav button{background:none;border:0;padding:0 16px;font-size:14px;font-weight:700;color:var(--muted);position:relative}
 .topnav button:hover,.topnav button.active{color:var(--ink)}
 .topnav button.active:after{content:'';position:absolute;left:16px;right:16px;bottom:-1px;height:3px;background:var(--rust)}
 .bnav{display:none}
 .page{padding-bottom:64px}
 footer{padding-bottom:36px}
 .tabs{margin:-24px -28px 0;padding:0 28px}
 .cover{margin:-24px -28px 0;height:560px}
 .cover-txt{left:28px;bottom:28px}.cover-txt h1{font-size:72px}
 .dayhero{margin:0 -28px;height:320px}.dayhero-txt{left:28px}
 .stop{grid-template-columns:72px 1fr;gap:16px}
 .leg{padding-left:24px}
 .toast{bottom:24px}
}
@media(prefers-reduced-motion:reduce){.page.active{animation:none}.toast,.meter i,.btn{transition:opacity .15s}}
@media print{header,.bnav,.sact,.btn,.tabs{display:none!important}.page{display:block!important}}
</style>
</head>

{id:'c5',text:'確認 IT281 的航廈、報到截止時間與託運行李'},
{id:'c6',text:'12/17 當天查看宇都宮 → 成田機場導航交通時間'}];

/* state */
function load(){
 try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.done)return s}catch(e){}
 const s={done:{},checks:{},expenses:[],notes:[]};
 try{const o=JSON.parse(localStorage.getItem(OLDKEY));if(o){
  for(const st of Object.values(o.timeline||{}))for(const x of st)if(x.done)s.done[x.id]=true;
  for(const c of o.checklist||[])if(c.done)s.checks[c.id]=true;
  if(Array.isArray(o.expenses))s.expenses=o.expenses;
  if(Array.isArray(o.notes))s.notes=o.notes.filter(n=>n.id!=='n1');
 }}catch(e){}
 return s}
let state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('這支手機的儲存空間滿了，請先到帳本頁匯出備份');return false}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');

/* time */
const pad=n=>String(n).padStart(2,'0');
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function times(t){const m=t.match(/\d{1,2}:\d{2}/g)||[];const toMin=x=>{const[a,b]=x.split(':');return +a*60+ +b};return{start:m[0]?toMin(m[0]):0,end:m[1]?toMin(m[1]):(m[0]?toMin(m[0])+30:0),s:m[0]||'',e:m[1]||''}}
function tripDay(){return DAYS.find(d=>d.date===todayStr())}
function currentStop(day){const n=nowMin(),st=STOPS[day.id];return st.find(s=>!state.done[s.id]&&times(s.time).end>n)||st.find(s=>!state.done[s.id])}
function daysUntil(){const a=new Date(todayStr()+'T00:00:00'),b=new Date(DAYS[0].date+'T00:00:00');return Math.round((b-a)/864e5)}

 document.querySelectorAll('[data-page]').forEach(e=>{const on=e.dataset.page===p;e.classList.toggle('active',on);on?e.setAttribute('aria-current','page'):e.removeAttribute('aria-current')});
 render(p);window.scrollTo(0,0)}

/* schematic route map — not to scale. Each point: x, y, name, label x, label y, anchor, optional second line */
const PTS={
 sj:[130,236,'新宿',120,240,'end','12/15 出發'],
 nk:[60,40,'日光',60,27,'middle'],
 ht:[150,98,'飯店',141,113,'end'],
 wf:[222,50,'若山農場',231,55,'start'],
 oy:[214,140,'大谷',223,145,'start'],

const LEGS={d5:['sj','nk','ht'],d6:['ht','wf','oy','uc'],d7:['ht','nr']};
const MAPSTYLE={d5:{c:'#202521',dash:''},d6:{c:'#4f6453',dash:'1 5'},d7:{c:'#202521',dash:'8 5'}};
const DATELBL={d5:[84,150,'end'],d6:[176,64,'end'],d7:[238,166,'start']};
let mapFocus=null;
function routeMap(active,where){
 const f=active||null,dim=id=>f&&f!==id;
 const line=id=>{const p=LEGS[id].map(k=>PTS[k].slice(0,2).join(',')).join(' '),s=MAPSTYLE[id];return `<polyline points="${p}" fill="none" stroke="${dim(id)?'#c9cdc4':s.c}" stroke-width="${f===id?3:2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?`stroke-dasharray="${s.dash}"`:''}/>`};
 /* arrow on day 1, halfway from 新宿 toward 日光 */
 const [ax,ay]=[(PTS.sj[0]+PTS.nk[0])/2,(PTS.sj[1]+PTS.nk[1])/2],ang=Math.atan2(PTS.nk[1]-PTS.sj[1],PTS.nk[0]-PTS.sj[0])*180/Math.PI;
 const arrow=`<path d="M-5 -5 L3 0 L-5 5" fill="none" stroke="${dim('d5')?'#c9cdc4':'#202521'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(${ax} ${ay}) rotate(${ang})"/>`;
 const dates=['d5','d6','d7'].map(id=>{const [x,y,a]=DATELBL[id],d=DAYS.find(z=>z.id===id);return `<text x="${x}" y="${y}" text-anchor="${a}" class="mdate" fill="${dim(id)?'#b9beb5':MAPSTYLE[id].c}">${d.md}</text>`}).join('');
 const used=f?new Set(LEGS[f]):null;
 const dots=Object.entries(PTS).map(([k,[x,y,n,lx,ly,an,sub]])=>{const on=!used||used.has(k);
  const mark=k==='nr'?`<circle cx="${x}" cy="${y}" r="7" fill="#eae9e3" stroke="#202521" stroke-width="1.6"/><circle cx="${x}" cy="${y}" r="3" fill="#202521"/>`:`<circle cx="${x}" cy="${y}" r="${k==='ht'?6:4.5}" fill="${k==='ht'?'#202521':'#eae9e3'}" stroke="#202521" stroke-width="1.6"/>`;
  return `<g opacity="${on?1:.3}">${mark}<text x="${lx}" y="${ly}" text-anchor="${an}" font-size="13" font-weight="700" fill="#202521">${n}</text>${sub?`<text x="${lx}" y="${ly+15}" text-anchor="${an}" class="mdate" fill="#5c645e">${sub}</text>`:''}</g>`}).join('');
 const chips=`<div class="mchips" role="group" aria-label="只看某一天">${DAYS.map(d=>`<button type="button" class="mchip" aria-pressed="${f===d.id}" onclick="mapPick('${d.id}','${where}')">${d.md}</button>`).join('')}</div>`;
 return `<figure class="rmap" id="rmap-${where}"><svg viewBox="0 0 340 272" role="img" aria-label="路線示意圖：12/15 從新宿出發到日光，再到宇都宮的飯店；12/16 在宇都宮周邊移動，若山農場、大谷、宇都宮市區；12/17 從飯店前往成田 T2">${['d5','d6','d7'].map(line).join('')}${arrow}${dates}${dots}</svg><figcaption>${chips}<span class="rnote">示意圖，非實際比例</span></figcaption></figure>`}
function mapPick(id,where){
 if(where==='route'){selectedDay=id;renderRoute();return}
 mapFocus=mapFocus===id?null:id;
 const el=document.getElementById('rmap-today');if(el)el.outerHTML=routeMap(mapFocus,'today')}

/* today */
const done=st=>st.filter(s=>state.done[s.id]).length;
const checksDone=()=>CHECKS.filter(c=>state.checks[c.id]).length;
function dayLinks(){const t=tripDay();return DAYS.map((d,j)=>{const st=STOPS[d.id],on=t&&t.id===d.id;return `<a class="dayrow ${on?'today':''}" href="#route" onclick="event.preventDefault();openDay('${d.id}')">${img(DAYIMG[d.id],'thumb','',false)}<div class="dtxt"><div class="dmeta"><span class="num">${d.md}</span> 週${d.wd}・第 ${j+1} 天${on?'<span class="tag">今天</span>':''}</div><h3>${esc(d.name)}</h3><p>${esc(d.area)}・${done(st)}/${st.length} 站</p></div>${I('right')}</a>`}).join('')}
function renderToday(){
 const t=tripDay(),left=daysUntil();let status;
 if(t){const s=currentStop(t),tm=s?times(s.time):null;
  status=`<div class="lead">${s?`<div class="state">${tm.start<=nowMin()?'正在進行':'下一站'}・<span class="num">${esc(s.time)}</span></div><h2>${esc(s.name)}</h2><div class="btnrow"><a class="btn accent" href="${esc(s.map)}" target="_blank" rel="noopener">導航${I('out')}</a><button class="btn ghost" onclick="openDay('${t.id}')">今天全部行程</button></div>`:`<h2>今天的行程都完成了，辛苦了。</h2><div class="btnrow"><a class="btn accent" href="${HOTEL_MAP}" target="_blank" rel="noopener">回飯店導航${I('out')}</a></div>`}</div>`}
 else if(left>0){const todo=CHECKS.filter(c=>!state.checks[c.id]);
  status=`<div class="lead"><h2>還有 <span class="num">${left}</span> 天出發</h2><p>12/15（二）09:00 在新宿取車，往日光出發。</p></div>
  <div class="section"><h2>出發前還要確認<span class="count num">${todo.length}</span></h2>${todo.length?todo.slice(0,3).map(c=>checkRow(c,'renderToday')).join('')+(todo.length>3?`<button class="more" onclick="go('check')">還有 ${todo.length-3} 項${I('right')}</button>`:''):'<p class="empty">全部確認完成，可以安心出發。</p>'}</div>`}
 else status=`<div class="lead"><h2>謝謝這三天。</h2><p>帳本與筆記都還留在「帳本」頁，記得匯出備份。</p></div>`;
 document.getElementById('page-today').innerHTML=`<div class="cover">${img('cover','cover-img','秋天山間的彎道，路中央一條橘色分隔線',true)}<div class="cover-txt"><h1>日光<br>宇都宮</h1><p><span class="num">2026.12.15–17</span>　三天自駕</p></div></div>${status}

/* route */

function renderRoute(){
 const d=DAYS.find(x=>x.id===selectedDay)||DAYS[0],st=STOPS[d.id],dn=done(st),j=DAYS.indexOf(d);
 const t=tripDay(),cur=t&&t.id===d.id?currentStop(d):null;
 document.getElementById('page-route').innerHTML=`<div class="tabs" role="tablist" aria-label="選擇日期">${DAYS.map((x,k)=>`<button class="tab ${x.id===d.id?'active':''}" role="tab" aria-selected="${x.id===d.id}" onclick="selectedDay='${x.id}';renderRoute();window.scrollTo(0,0)"><b class="num">${x.md}</b><span>第 ${k+1} 天・週${x.wd}</span></button>`).join('')}</div>
 <div class="dayhero">${img(DAYIMG[d.id],'dayhero-img','',true)}<div class="dayhero-txt"><div class="dmeta"><span class="num">${d.md}</span> 週${d.wd}・${esc(d.area)}</div><h2>${esc(d.name)}</h2></div></div>
 <p class="daydesc">${esc(d.desc)}</p>${routeMap(d.id,'route')}<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${st.length}" aria-valuenow="${dn}"><i style="width:${dn/st.length*100}%"></i></div><div class="dayprog">${dn} / ${st.length} 站完成</div>
 <ol class="timeline">${st.map(s=>{const tm=times(s.time),on=!!state.done[s.id],now=cur&&cur.id===s.id,mv=MOVES[s.id];return `${mv?`<li class="leg">${I(mv[0])}<span><b>${MODE[mv[0]]}</b>　${esc(mv[1])}</span></li>`:''}<li class="stop ${on?'done':''} ${now?'now':''}"><div class="stime num"><b>${tm.s}</b>${tm.e?`<span>${tm.e}</span>`:''}</div><div class="sbody">${now?'<span class="tag now">現在</span>':''}<h3>${esc(s.name)}</h3>${s.alert?`<div class="alert">${I('warn')}<span>${esc(s.alert)}</span></div>`:''}<p class="detail clamp" onclick="this.classList.toggle('clamp')">${esc(s.detail)}</p><div class="sact"><a class="btn ${now?'accent':'dark'} go" href="${esc(s.map)}" target="_blank" rel="noopener">導航${I('out')}</a><button class="btn ghost chk" aria-pressed="${on}" onclick="toggleStop('${s.id}')">${on?I('check')+'完成':I('circle')+'完成'}</button></div></div></li>`}).join('')}</ol>
 ${d.flight?`<div class="alert endnote">${I('warn')}<span>13:00 為預定起飛時間，非準點保證。請依台灣虎航與機場最新公告為準。</span></div>`:''}
 ${d.hotel?`<div class="section hotel"><h2>今晚住宿</h2><h3>Fairfield by Marriott Tochigi Utsunomiya</h3><p>栃木宇都宮萬楓酒店・平面停車場</p><a class="btn dark" href="${HOTEL_MAP}" target="_blank" rel="noopener">飯店導航${I('out')}</a></div>`:''}`}
function toggleStop(id){state.done[id]=!state.done[id];save();const y=scrollY;renderRoute();scrollTo(0,y)}

/* checklist */
function checkRow(c,rer){return `<label class="checkrow"><input type="checkbox" ${state.checks[c.id]?'checked':''} onchange="state.checks['${c.id}']=this.checked;save();const y=scrollY;${rer}();scrollTo(0,y)"><span class="txt">${esc(c.text)}</span></label>`}
function renderCheck(){const n=checksDone();document.getElementById('page-check').innerHTML=`<div class="pagehead"><h1>行前清單<span class="dot">.</span></h1><p>出發前逐項確認，勾選會存在這支手機。</p><div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${CHECKS.length}" aria-valuenow="${n}"><i style="width:${n/CHECKS.length*100}%"></i></div><div class="dayprog">${n} / ${CHECKS.length} 項已確認</div></div>${CHECKS.map(c=>checkRow(c,'renderCheck')).join('')}`}

/* more: ledger + notes + backup (inline forms, no modal) */
let editExp=null,editNote=null,showExp=false,showNote=false;
function renderMore(){const total=state.expenses.reduce((a,e)=>a+Number(e.amount||0),0);
 const cats=CATS.map(c=>[c,state.expenses.filter(e=>e.category===c).reduce((a,e)=>a+Number(e.amount||0),0)]).filter(x=>x[1]);
 const ex=state.expenses.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 const e=state.expenses.find(x=>x.id===editExp),n=state.notes.find(x=>x.id===editNote);
 const d=new Date(),today=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,defDate=today>='2026-12-15'&&today<='2026-12-17'?today:'2026-12-15';
 document.getElementById('page-more').innerHTML=`<div class="pagehead"><h1>旅行帳本<span class="dot">.</span></h1><p>以日圓記帳，只存在這支手機。</p></div>
 <div class="total num" aria-label="總支出">${yen(total)}</div>${cats.length?`<div class="cats">${cats.map(([c,v])=>`<span class="cat">${c} <span class="num">${yen(v)}</span></span>`).join('')}</div>`:''}
 ${showExp?`<form class="form" id="expForm"><h3>${e?'編輯支出':'記一筆支出'}</h3>
  <label class="fl">項目<input class="field" name="name" required value="${esc(e?.name)}" placeholder="例：東照宮門票"></label>
  <div class="grid2"><label class="fl">金額（日圓）<input class="field num" name="amount" type="number" inputmode="numeric" min="0" required value="${esc(e?.amount??'')}"></label><label class="fl">類別<select class="field" name="category">${CATS.map(c=>`<option ${e?.category===c?'selected':''}>${c}</option>`).join('')}</select></label></div>
  <label class="fl">日期<input class="field" name="date" type="date" value="${esc(e?.date||defDate)}"></label>
  <div class="btnrow">${e?`<button type="button" class="btn danger" onclick="delExpense('${e.id}')">刪除</button>`:`<button type="button" class="btn ghost" onclick="showExp=false;editExp=null;renderMore()">取消</button>`}<button class="btn dark" type="submit">${e?'儲存修改':'記下這筆'}</button></div></form>`:`<button class="btn dark block" onclick="showExp=true;editExp=null;renderMore();focusForm('expForm')">${I('plus')}記一筆支出</button>`}
 <div style="margin-top:6px">${ex.length?ex.map(x=>`<button class="row" onclick="showExp=true;editExp='${x.id}';renderMore();focusForm('expForm')"><span class="l">${esc(x.name)}<small><span class="num">${esc(x.date||'')}</span>・${esc(x.category)}</small></span><span class="num">${yen(x.amount)}</span></button>`).join(''):'<div class="empty">還沒有支出。付了門票、油錢或晚餐，就在這裡記一筆，回國後能一眼看出各類別花多少。</div>'}</div>
 <div class="section"><h2>田野筆記</h2>
 ${showNote?`<form class="form" id="noteForm" style="margin-top:14px"><h3>${n?'編輯筆記':'新增觀察'}</h3><label class="fl">內容<textarea class="field" name="text" rows="5" required placeholder="今天看見了什麼？">${esc(n?.text)}</textarea></label><label class="fl">日期或標籤<input class="field" name="date" value="${esc(n?.date||new Date().toLocaleDateString('zh-TW'))}"></label><div class="btnrow">${n?`<button type="button" class="btn danger" onclick="delNote('${n.id}')">刪除</button>`:`<button type="button" class="btn ghost" onclick="showNote=false;editNote=null;renderMore()">取消</button>`}<button class="btn dark" type="submit">${n?'儲存修改':'記下'}</button></div></form>`:`<button class="btn ghost block" style="margin-top:14px" onclick="showNote=true;editNote=null;renderMore();focusForm('noteForm')">${I('plus')}新增觀察</button>`}
 ${state.notes.length?state.notes.slice().reverse().map(x=>`<button class="note" onclick="showNote=true;editNote='${x.id}';renderMore();focusForm('noteForm')">${esc(x.text)}<small>${esc(x.date)}</small></button>`).join(''):'<div class="empty">窗框、石頭的顏色、一句旅途中想到的話，都可以記在這裡。</div>'}</div>
 <div class="section"><h2>資料備份</h2><p class="help">紀錄只存在這支手機的瀏覽器，換手機或清除瀏覽資料就會不見。旅途中偶爾匯出一次。</p>
 <div class="stack"><button class="btn ghost" onclick="exportJSON()">${I('down')}匯出備份</button><button class="btn ghost" onclick="document.getElementById('imp').click()">${I('up')}匯入備份</button><button class="btn ghost" onclick="exportCSV()">${I('down')}帳本匯出 CSV</button></div>
 <input id="imp" type="file" accept=".json,application/json" hidden onchange="importJSON(event)"></div>`;
 const ef=document.getElementById('expForm');if(ef)ef.onsubmit=ev=>{ev.preventDefault();const f=new FormData(ef),amount=Number(f.get('amount'));if(!Number.isFinite(amount)||amount<0)return toast('金額請填 0 以上的數字');const item={id:e?.id||uid(),name:String(f.get('name')).trim(),amount,category:String(f.get('category')),date:String(f.get('date'))};if(!item.name)return toast('請填寫項目名稱');if(e)Object.assign(e,item);else state.expenses.push(item);showExp=false;editExp=null;save();renderMore();toast(e?'已更新這筆支出':'已記下 '+yen(amount))};
 const nf=document.getElementById('noteForm');if(nf)nf.onsubmit=ev=>{ev.preventDefault();const f=new FormData(nf),item={id:n?.id||uid(),text:String(f.get('text')).trim(),date:String(f.get('date'))};if(!item.text)return toast('先寫點內容再儲存');if(n)Object.assign(n,item);else state.notes.push(item);showNote=false;editNote=null;save();renderMore();toast('筆記已儲存')}}
function focusForm(id){const f=document.getElementById(id);if(!f)return;f.scrollIntoView({block:'center',behavior:'smooth'});setTimeout(()=>f.querySelector('input,textarea')?.focus({preventScroll:true}),250)}
function delExpense(id){if(!confirm('刪除這筆支出？刪除後無法復原。'))return;state.expenses=state.expenses.filter(e=>e.id!==id);showExp=false;editExp=null;save();renderMore();toast('已刪除')}
function delNote(id){if(!confirm('刪除這則筆記？刪除後無法復原。'))return;state.notes=state.notes.filter(n=>n.id!==id);showNote=false;editNote=null;save();renderMore();toast('已刪除')}
function download(name,content,type){const u=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500)}
function exportJSON(){download('utsunomiya-2026-backup.json',JSON.stringify(state,null,2),'application/json');toast('備份檔已下載')}
function exportCSV(){if(!state.expenses.length)return toast('帳本還是空的，沒有可匯出的支出');const rows=[['日期','類別','項目','日圓'],...state.expenses.map(e=>[e.date,e.category,e.name,e.amount])];download('utsunomiya-2026-expenses.csv','﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV 已下載')}
async function importJSON(ev){const f=ev.target.files?.[0];if(!f)return;try{const s=JSON.parse(await f.text());if(!s||typeof s.done!=='object'||!Array.isArray(s.expenses)||!Array.isArray(s.notes))throw 0;if(!confirm('匯入會取代這支手機目前的紀錄，確定嗎？'))return;s.checks=s.checks||{};state=s;save();renderMore();toast('備份已匯入')}catch(e){toast('這不是本手札的備份檔，請選擇「匯出備份」下載的 JSON')}finally{ev.target.value=''}}

document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const p=location.hash.slice(1)||'today';if(p==='today'||p==='route'){const y=scrollY;render(p);scrollTo(0,y)}}});
go(location.hash.slice(1)||'today');
</script>
</body>
</html>

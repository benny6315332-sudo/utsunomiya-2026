<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eae9e3">
<meta name="description" content="宇都宮・日光 3 日旅行手札 2026.12.15–12.17">
<title>TOCHIGI FIELD ARCHIVE — 宇都宮・日光</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#eae9e3;--card:#f4f3ee;--ink:#202521;--muted:#6a726b;--line:#c3c8bf;--green:#596e5d;--rust:#b4673e;--rust-bg:rgba(180,103,62,.09);--header:56px;--nav:64px;--mono:'DM Mono',ui-monospace,monospace;--sans:'Noto Sans TC',-apple-system,'PingFang TC',sans-serif}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
::selection{background:var(--rust);color:#fff}
.mono{font-family:var(--mono);letter-spacing:.04em}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}

/* header */
.topline{height:4px;background:var(--ink)}
header{position:sticky;top:0;z-index:40;height:var(--header);background:rgba(234,233,227,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--ink)}
.head{height:100%;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;border:2px solid var(--ink);display:grid;place-items:center;font:500 10px var(--mono);position:relative}
.mark:before{content:'';position:absolute;width:12px;height:12px;border:1px solid var(--ink);transform:rotate(45deg)}
.brand b{font:500 11px/1.25 var(--mono);letter-spacing:.03em}
.head .when{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
.topnav{display:none}

/* pages */
.page{display:none;padding:22px 0 calc(var(--nav) + 40px + env(safe-area-inset-bottom))}
.page.active{display:block;animation:rise .3s ease}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0;letter-spacing:-.02em}
.pagehead{margin:4px 0 20px}
.pagehead h1{font-size:34px;line-height:1.2;font-weight:900;margin-top:4px}
.dot{color:var(--rust)}

/* hero */
.hero h1{font:900 clamp(52px,16vw,96px)/.9 Arial,Helvetica,sans-serif;letter-spacing:-.08em;margin:8px 0 6px}
.hero .sub{font-size:20px;font-weight:700;letter-spacing:.12em}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font:500 12px var(--mono);color:var(--muted)}
.band{height:92px;margin:18px 0 18px;border:1px solid var(--ink);overflow:hidden;background:#c3c8be}
.band svg{display:block;width:100%;height:100%}

/* status card */
.status{background:var(--ink);color:#f4f3ee;padding:20px 18px 18px;margin-bottom:14px}
.status .label{color:#a9b1aa}
.big{font:500 56px/1 var(--mono);letter-spacing:-.06em;margin:10px 0 4px}
.big small{font:700 18px var(--sans);letter-spacing:0;margin-left:6px}
.status p{margin:6px 0 0;color:#cfd4cd;font-size:14px}
.next{border-top:1px solid #4a524c;margin-top:16px;padding-top:14px}
.next .t{font:500 15px var(--mono);color:#e39a71}
.next h3{font-size:21px;line-height:1.4;margin:4px 0 12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border:1px solid var(--ink);background:transparent;font-size:15px;font-weight:700}
.btn.dark{background:var(--ink);color:#f4f3ee}
.btn.rust{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.light{background:#f4f3ee;color:var(--ink);border-color:#f4f3ee}
.btn.ghost{border-color:var(--line)}
.btn.sm{min-height:40px;font-size:13px;padding:0 12px}
.btnrow{display:flex;gap:8px}.btnrow .btn{flex:1}

/* day list */
.section{margin-top:30px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:0}
.section-title h2{font-size:20px;font-weight:900}
.daylink{display:grid;grid-template-columns:54px 1fr 20px;gap:12px;align-items:center;padding:16px 2px;border-bottom:1px solid var(--line)}
.daylink .d{font:500 13px/1.3 var(--mono);color:var(--rust)}
.daylink .d b{display:block;font-size:22px;color:var(--ink);letter-spacing:-.05em}
.daylink h3{font-size:17px;line-height:1.45}
.daylink p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.daylink .arr{font-family:var(--mono);font-size:18px}
.daylink.today{background:var(--card);padding-left:10px;padding-right:10px;margin:0 -10px;border-left:3px solid var(--rust)}

.hotel{border:1px solid var(--ink);padding:16px;margin-top:14px;background:var(--card)}
.hotel strong{display:block;font-size:17px;line-height:1.4;margin:6px 0 2px}
.hotel p{margin:0 0 12px;font-size:13px;color:var(--muted)}

.progress{height:6px;background:var(--line);margin:10px 0 4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);transition:width .3s}

/* route */
.tabs{position:sticky;top:var(--header);z-index:20;background:var(--paper);display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--ink);margin:0 -18px;padding:0 18px}
.tab{background:none;border:0;padding:12px 4px 10px;text-align:left;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab b{display:block;font:500 20px/1.1 var(--mono);letter-spacing:-.05em}
.tab span{font-size:12px;font-weight:700}
.tab.active{color:var(--ink);border-color:var(--rust)}
.dayintro{padding:20px 0 6px}
.dayintro h2{font-size:26px;line-height:1.35;font-weight:900;margin:6px 0 8px}
.dayintro p{margin:0;color:var(--muted);font-size:14px}
.dayprog{font:500 12px var(--mono);color:var(--muted);margin-top:10px}

.timeline{position:relative;margin-top:14px}
.stop{display:grid;grid-template-columns:62px 1fr;gap:12px;position:relative;padding-bottom:14px}
.stop:before{content:'';position:absolute;left:30px;top:30px;bottom:0;width:1px;background:var(--line)}
.stop:last-child:before{display:none}
.stime{text-align:center;padding-top:14px;position:relative;z-index:1}
.stime b{display:block;font:500 17px/1.1 var(--mono);letter-spacing:-.04em;background:var(--paper);padding:2px 0}
.stime span{display:block;font:400 12px var(--mono);color:var(--muted);margin-top:3px;background:var(--paper)}
.scard{background:var(--card);border:1px solid var(--line);padding:14px 14px 12px}
.stop.done .scard{opacity:.55}
.stop.done h3{text-decoration:line-through}
.stop.now .scard{border-color:var(--ink);box-shadow:4px 4px 0 var(--rust)}
.scard .label{font-size:10px}
.scard h3{font-size:18px;line-height:1.45;margin:4px 0 6px}
.scard p{margin:0;font-size:14px;line-height:1.8;color:#4d554f;overflow-wrap:anywhere}
.alert{margin-top:10px;border-left:3px solid var(--rust);background:var(--rust-bg);padding:9px 11px;font-size:13px;line-height:1.75}
.alert b{display:block;font:500 11px var(--mono);letter-spacing:.06em;color:var(--rust)}
.sact{display:flex;gap:8px;margin-top:12px}
.sact .btn{min-height:44px;font-size:14px}
.sact .go{flex:1}
.sact .chk{width:96px;flex:none}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.endnote{margin:4px 0 0 74px}

/* checklist */
.checkrow{display:flex;gap:14px;align-items:flex-start;padding:16px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px;line-height:1.65}
.checkrow input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:1.5px solid var(--ink);flex:none;margin:1px 0 0;display:grid;place-items:center;background:var(--card)}
.checkrow input:checked{background:var(--green);border-color:var(--green)}
.checkrow input:checked:after{content:'✓';color:#fff;font-size:15px;line-height:1}
.checkrow .n{font:500 12px var(--mono);color:var(--rust);padding-top:3px;flex:none}
.checkrow:has(input:checked) .txt{opacity:.5;text-decoration:line-through}

/* more */
.total{font:500 44px/1.1 var(--mono);letter-spacing:-.06em;margin:14px 0 10px}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.cat{font:400 12px var(--mono);border:1px solid var(--line);padding:4px 8px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);font-size:14px;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row .l{flex:1}
.row small{display:block;font:400 11px var(--mono);color:var(--muted)}
.row .amt{font-family:var(--mono)}
.note{background:var(--card);border:1px solid var(--line);padding:14px;margin-top:10px;white-space:pre-wrap;font-size:15px;line-height:1.85;text-align:left;width:100%;display:block}
.note small{display:block;font:400 11px var(--mono);color:var(--muted);margin-top:8px}
.empty{padding:22px 4px;color:var(--muted);font-size:14px}
.stack{display:grid;gap:8px;margin-top:14px}
.help{font-size:13px;color:var(--muted);margin:8px 0 0}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:45;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(234,233,227,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--ink);display:grid;grid-template-columns:repeat(4,1fr)}
.bnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.bnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.bnav button.active{color:var(--rust)}

footer{border-top:1px solid var(--ink);padding:22px 0 calc(var(--nav) + 30px);}
footer .logo{font:900 40px/1 Arial,sans-serif;letter-spacing:-.08em}
footer p{margin:6px 0 0;font:400 11px var(--mono);color:var(--muted)}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(20,25,21,.6);display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{width:100%;max-width:560px;max-height:90dvh;overflow:auto;background:var(--paper);border-top:1px solid var(--ink);padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.modal h2{font-size:20px;font-weight:900;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal h2 button{border:0;background:none;font-size:28px;line-height:1;padding:0 4px}
.field{display:block;width:100%;background:#fff;border:1px solid var(--line);padding:12px;border-radius:0;font-size:16px;outline:0;margin-top:6px}
.field:focus{border-color:var(--rust)}
.fl{display:block;font-size:13px;font-weight:700;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom));z-index:120;background:var(--ink);color:#fff;padding:12px 16px;font-size:14px;box-shadow:4px 4px 0 var(--rust);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;max-width:420px;margin:0 auto}
.toast.show{opacity:1;transform:none}

@media(min-width:860px){
 :root{--header:64px}
 .wrap{padding:0 28px}
 .head .when{margin-left:24px}
 .topnav{display:flex;margin-left:auto;height:100%}
 .topnav button{background:none;border:0;padding:0 16px;font-size:13px;font-weight:700;color:var(--muted);position:relative}
 .topnav button.active{color:var(--ink)}
 .topnav button.active:after{content:'';position:absolute;left:16px;right:16px;bottom:0;height:3px;background:var(--rust)}
 .bnav{display:none}
 .page{padding-bottom:60px}
 footer{padding-bottom:36px}
 .tabs{margin:0 -28px;padding:0 28px}
 .band{height:150px}
 .stop{grid-template-columns:84px 1fr;gap:18px}
 .stop:before{left:41px}
 .endnote{margin-left:102px}
 .modal-bg{align-items:center}
 .modal{border:1px solid var(--ink)}
 .toast{bottom:24px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,.bnav,.sact,.btn,.tabs{display:none!important}.page{display:block!important}}
</style>
</head>

const KEY='utsunomiya-2026-v2', OLDKEY='tochigi-field-archive-v1';
const DAYS=[
{id:'d5',date:'2026-12-15',md:'12/15',wd:'二',name:'新宿出發・日光世界遺產',area:'新宿 → 日光 → 宇都宮',desc:'09:00 從新宿租車出發，參拜日光東照宮、二荒山神社，晚上抵達栃木宇都宮萬楓酒店。',hotel:true},

const M=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const STOPS={
d5:[
{id:'d5a',time:'09:00 – 11:30',name:'新宿取車自駕出發，前往日光',detail:'路線：東北自動車道 → 日光宇都宮道路。預估車程約 2 小時至 2 小時 15 分，09:00–11:30 保留取車與交通緩衝。',alert:'12 月中旬山區可能結霜或出現黑冰；請事前向租車公司確認雪胎（Studless Tires）與 ETC 卡，並依氣象與路況調整。',map:M('東武日光駅')},
{id:'d5b',time:'11:30 – 12:45',name:'日光站周邊停車＆湯波午餐',detail:'建議在東武日光站或 JR 日光站周邊收費停車場停車，換巴士進入世界遺產區，避開山區坡道可能的冰面。若天氣與道路良好，可評估東照宮附近停車場。品嚐湯波（腐皮）料理及炸腐皮饅頭。',map:M('東武日光駅 駐車場')},

{id:'d5d',time:'16:00 – 16:40',name:'前往萬楓酒店・入住',detail:'Fairfield by Marriott Tochigi Utsunomiya。預計車程 35–40 分鐘（實際視路況）。12/15、12/16 連住兩晚，使用飯店平面停車場，免搬行李。',map:M('Fairfield by Marriott Tochigi Utsunomiya')},

{id:'d6b',time:'09:00 – 10:30',name:'若竹の杜 若山農場：竹林散步＆竹器抹茶',detail:'從飯店開車約 5–7 分鐘。漫步孟宗竹、金明竹竹林，觀察冬季低角度陽光與竹影。曾為《神劍闖江湖》《王者天下》取景地。期待體驗竹杯抹茶與和菓子，並詢問竹杯是否可帶走。',alert:'12/16 為週三，官方竹杯抹茶主要在週末／國定假日提供，平日不保證有茶席；務必提前聯繫確認。即使無抹茶仍可竹林散步。',map:M('若竹の杜 若山農場')},
{id:'d6c',time:'10:45 – 12:45',name:'大谷資料館、ROCKSIDE MARKET＆大谷寺',detail:'從若山農場車程約 15 分鐘。探索地下約 30 公尺的巨大採石遺跡，留意石壁肌理和光線；出館後走訪 ROCKSIDE MARKET，再順遊大谷寺與岩壁上的和平觀音。',alert:'冬季 09:30–16:30（16:00 最終入館）；12–3 月週二休館，週三通常開館，另須留意臨時休館。',map:M('大谷資料館')},
{id:'d6d',time:'13:15 – 15:15',name:'宇都宮餃子午餐＆宇都宮二荒山神社',detail:'開車進市區（約 15–20 分鐘）。選前晚未吃到的餃子名店，如正嗣宮島本店或香蘭；之後散步到市中心的宇都宮二荒山神社。注意各店休息日與排隊。',map:M('宇都宮二荒山神社')},
{id:'d6e',time:'15:15 – 17:30',name:'宇都宮 LRT 輕軌／松峰天主堂',detail:'二選一：體驗黃黑配色的芳賀・宇都宮 LRT，或拜訪以大谷石建造的哥德式「松峰天主教教會」。若搭輕軌，先找合適停車點並確認來回班次。',map:M('カトリック松が峰教会')},
{id:'d6f',time:'18:00 – 20:30',name:'宇都宮特色晚餐・整理行李',detail:'市區享用栃木和牛燒肉或居酒屋；時間允許可安排「ベルさくらの湯」泡湯。返回萬楓酒店整理隔天回國行李。',map:M('Fairfield by Marriott Tochigi Utsunomiya')}],
d7:[
{id:'d7a',time:'08:00',name:'退房・全團自駕往成田',detail:'建議路線：北關東自動車道 → 友部 JCT → 常磐自動車道 → 圈央道 → 成田。依實際導航行駛；可避開東京都心，但不保證全程無塞車。',alert:'約 2 小時僅供初估，距離、收費與抵達時間需依當天導航確認；建議留充裕機場緩衝。',map:M('成田国際空港 第2ターミナル')},
{id:'d7b',time:'10:15 – 10:30',name:'成田機場 T2 出發層落客',detail:'司機當天不返國；車輛抵達第二航廈指定落客區後，返國成員攜行李下車，司機再自行離開。停靠須遵守現場規範。',map:M('成田国際空港 第2ターミナル')},
{id:'d7c',time:'10:30 – 12:15',name:'虎航 IT281 報到托運、安檢與免稅店',detail:'目標 10:30 前到台灣虎航櫃檯辦理報到及託運，之後安檢與出境。預留時間找正確櫃檯、航廈及登機門。',alert:'以航空公司當日公告為準；起飛前 45 分鐘（12:15）為完成報到的最晚警戒點，切勿壓線。',map:M('成田国際空港 第2ターミナル')},
{id:'d7d',time:'13:00',name:'IT281 成田起飛・返抵高雄',detail:'台灣虎航 IT281：預定 NRT 13:00 起飛，KHH 約 16:40 抵達（台灣時間）。依電子機票與當日航班公告為準。',map:M('高雄國際機場')}]};
const CHECKS=[
{id:'c1',text:'確認 12/15 新宿租車已加選雪胎（Studless Tires）與 ETC 卡'},
{id:'c2',text:'確認 12/15、12/16 連住萬楓酒店兩晚及停車安排'},
{id:'c3',text:'聯絡若山農場確認週三竹器抹茶、和菓子及竹杯帶回規則'},
{id:'c4',text:'出發前查詢日光道路結冰／降雪與停車場狀況'},
{id:'c5',text:'確認 IT281 的航廈、報到截止時間與託運行李'},
{id:'c6',text:'12/17 當天查看宇都宮 → 成田機場導航交通時間'}];
const CATS=['交通','住宿','飲食','門票','購物','其他'];
const HOTEL_MAP=M('Fairfield by Marriott Tochigi Utsunomiya');

/* state */
function load(){
 try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.done)return s}catch(e){}
 const s={done:{},checks:{},expenses:[],notes:[]};
 try{const o=JSON.parse(localStorage.getItem(OLDKEY));if(o){
  for(const st of Object.values(o.timeline||{}))for(const x of st)if(x.done)s.done[x.id]=true;
  for(const c of o.checklist||[])if(c.done)s.checks[c.id]=true;
  if(Array.isArray(o.expenses))s.expenses=o.expenses;
  if(Array.isArray(o.notes))s.notes=o.notes.filter(n=>n.id!=='n1');
 }}catch(e){}
 return s}
let state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('儲存失敗，請匯出備份')}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const uid=()=>Math.random().toString(36).slice(2,10);
let tt;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2600)}

/* time */
const pad=n=>String(n).padStart(2,'0');
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function times(t){const m=t.match(/\d{1,2}:\d{2}/g)||[];const toMin=x=>{const[a,b]=x.split(':');return +a*60+ +b};return{start:m[0]?toMin(m[0]):0,end:m[1]?toMin(m[1]):(m[0]?toMin(m[0])+30:0),s:m[0]||'',e:m[1]||''}}
function tripDay(){return DAYS.find(d=>d.date===todayStr())}
function currentStop(day){const n=nowMin();const st=STOPS[day.id];return st.find(s=>!state.done[s.id]&&times(s.time).end>n)||st.find(s=>!state.done[s.id])}
function daysUntil(){const a=new Date(todayStr()+'T00:00:00'),b=new Date(DAYS[0].date+'T00:00:00');return Math.round((b-a)/864e5)}

/* routing */
let selectedDay=(tripDay()||DAYS[0]).id;
const PAGES=['today','route','check','more'];
function go(p,keepScroll){if(!PAGES.includes(p))p='today';if(location.hash.slice(1)!==p)history.replaceState(null,'','#'+p);
 document.querySelectorAll('.page').forEach(e=>e.classList.toggle('active',e.id==='page-'+p));
 document.querySelectorAll('[data-page]').forEach(e=>e.classList.toggle('active',e.dataset.page===p));
 render(p);if(!keepScroll)window.scrollTo(0,0)}
function render(p){({today:renderToday,route:renderRoute,check:renderCheck,more:renderMore})[p]()}
function openDay(id){selectedDay=id;go('route')}

/* today */
const BAND=`<svg viewBox="0 0 1200 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="1200" height="150" fill="#c3c8be"/><path d="M0 0H360L330 150H0Z" fill="#a7afa3"/><path d="M80 0H220L205 150H60Z" fill="#8b998c"/><path d="M330 150V40L640 10V150" fill="#dce0d6" stroke="#28342d" stroke-width="2"/><path d="M380 150V60L590 40V150" fill="#a6b1a5" stroke="#28342d" stroke-width="2"/><path d="M430 150V80L545 70V150" fill="#263b31"/><path d="M680 150V20H1000V150" fill="#d4d9cf" stroke="#28342d" stroke-width="2"/><path d="M680 60H1000M680 100H1000M760 20V150M840 20V150M920 20V150" stroke="#66776a"/><path d="M1035 150V0M1085 150V0M1135 150V0M1185 150V0" stroke="#263b31" stroke-width="12"/><circle cx="655" cy="38" r="18" fill="#b4673e"/><path d="M655 26V50M643 38H667" stroke="#eae9e3" stroke-width="1.5"/><g fill="#29362d" font-family="monospace" font-size="12"><text x="24" y="138">OYA STONE</text><text x="690" y="138">SECTION / 02</text></g></svg>`;
function dayLinks(){const t=tripDay();return DAYS.map((d,i)=>{const st=STOPS[d.id],dn=st.filter(s=>state.done[s.id]).length;return `<a class="daylink ${t&&t.id===d.id?'today':''}" href="#route" onclick="event.preventDefault();openDay('${d.id}')"><div class="d">D0${i+1}<b>${d.md}</b></div><div><h3>${esc(d.name)}</h3><p>（${d.wd}）${esc(d.area)} · ${dn}/${st.length} 站</p></div><div class="arr">→</div></a>`}).join('')}
function checksDone(){return CHECKS.filter(c=>state.checks[c.id]).length}
function renderToday(){
 const t=tripDay(),left=daysUntil();let status;
 if(t){const i=DAYS.indexOf(t),s=currentStop(t);const tm=s?times(s.time):null;
  status=`<div class="status"><div class="label">TODAY / D0${i+1} · ${t.md}（${t.wd}）</div><h3 style="font-size:20px;margin-top:6px">${esc(t.name)}</h3>${s?`<div class="next"><div class="label">${tm.start<=nowMin()?'進行中 / NOW':'下一站 / NEXT'}</div><div class="t">${esc(s.time)}</div><h3>${esc(s.name)}</h3><div class="btnrow"><a class="btn rust" href="${esc(s.map)}" target="_blank" rel="noopener">導航 ↗</a><button class="btn light" onclick="openDay('${t.id}')">今天全部行程</button></div></div>`:`<p style="margin-top:12px">今天的行程都完成了。辛苦了！</p><div class="btnrow" style="margin-top:14px"><a class="btn light" href="${HOTEL_MAP}" target="_blank" rel="noopener">回飯店導航 ↗</a></div>`}</div>`}
 else if(left>0){const s=STOPS.d5[0];status=`<div class="status"><div class="label">COUNTDOWN / 距離出發</div><div class="big">${left}<small>天</small></div><p>12/15（二）09:00 新宿取車，往日光出發。</p><div class="next"><div class="label">行前清單</div><div class="progress" style="background:#4a524c"><i style="width:${checksDone()/CHECKS.length*100}%;background:#e39a71"></i></div><p>${checksDone()} / ${CHECKS.length} 項已確認</p><div class="btnrow" style="margin-top:12px"><button class="btn light" onclick="go('check')">打開行前清單 →</button></div></div></div>`}
 else status=`<div class="status"><div class="label">ARCHIVED / 旅程結束</div><h3 style="font-size:22px;margin-top:8px">謝謝這三天。</h3><p>帳本與筆記都還留在「帳本」頁，記得匯出備份。</p></div>`;
 document.getElementById('page-today').innerHTML=`<div class="hero"><div class="label">TRAVEL HANDBOOK / JAPAN / VOL. 001</div><h1>TOCHIGI<span class="dot">.</span></h1><div class="sub">宇都宮 ／ 日光</div><div class="meta"><span>2026.12.15—17</span><span>3 DAYS</span><span>SELF-DRIVE</span></div></div><div class="band">${BAND}</div>${status}
 <div class="section"><div class="section-title"><h2>三天路線</h2><span class="label">3 ROUTES</span></div>${dayLinks()}</div>
 <div class="hotel"><div class="label">BASE CAMP / 12.15—12.17</div><strong>Fairfield by Marriott Tochigi Utsunomiya</strong><p>栃木宇都宮萬楓酒店 · 連住兩晚 · 免費停車</p><a class="btn dark" href="${HOTEL_MAP}" target="_blank" rel="noopener">飯店導航 ↗</a></div>`}

/* route */
function renderRoute(){
 const d=DAYS.find(x=>x.id===selectedDay)||DAYS[0],i=DAYS.indexOf(d),st=STOPS[d.id],dn=st.filter(s=>state.done[s.id]).length;
 const t=tripDay(),cur=t&&t.id===d.id?currentStop(d):null;
 document.getElementById('page-route').innerHTML=`<div class="tabs" role="tablist">${DAYS.map((x,j)=>`<button class="tab ${x.id===d.id?'active':''}" role="tab" aria-selected="${x.id===d.id}" onclick="selectedDay='${x.id}';renderRoute();window.scrollTo(0,0)"><b>${x.md}</b><span>D0${j+1}（${x.wd}）</span></button>`).join('')}</div>
 <div class="dayintro"><div class="label">ROUTE 0${i+1} / ${esc(d.area)}</div><h2>${esc(d.name)}</h2><p>${esc(d.desc)}</p><div class="dayprog">${dn} / ${st.length} 站完成</div><div class="progress"><i style="width:${dn/st.length*100}%"></i></div></div>
 <div class="timeline">${st.map((s,k)=>{const tm=times(s.time),on=!!state.done[s.id];return `<article class="stop ${on?'done':''} ${cur&&cur.id===s.id?'now':''}"><div class="stime"><b>${tm.s}</b>${tm.e?`<span>${tm.e}</span>`:''}</div><div class="scard"><div class="label">STOP ${pad(k+1)}${cur&&cur.id===s.id?' · <span style="color:var(--rust)">NOW</span>':''}</div><h3>${esc(s.name)}</h3><p>${esc(s.detail)}</p>${s.alert?`<div class="alert"><b>注意 / CHECK</b>${esc(s.alert)}</div>`:''}<div class="sact"><a class="btn dark go" href="${esc(s.map)}" target="_blank" rel="noopener">導航 ↗</a><button class="btn ghost chk ${on?'on':''}" onclick="toggleStop('${s.id}')">${on?'✓ 完成':'○ 完成'}</button></div></div></article>`}).join('')}</div>
 ${d.flight?`<div class="alert endnote"><b>航班注意</b>13:00 為預定起飛時間，非準點保證。請依台灣虎航與機場最新資訊為準。</div>`:''}
 ${d.hotel?`<div class="hotel"><div class="label">今晚住宿</div><strong>Fairfield by Marriott Tochigi Utsunomiya</strong><p>栃木宇都宮萬楓酒店 · 平面停車場</p><a class="btn dark" href="${HOTEL_MAP}" target="_blank" rel="noopener">飯店導航 ↗</a></div>`:''}`}
function toggleStop(id){state.done[id]=!state.done[id];save();renderRoute()}

/* checklist */
function renderCheck(){const n=checksDone();document.getElementById('page-check').innerHTML=`<div class="pagehead"><div class="label">PRE-DEPARTURE</div><h1>行前清單<span class="dot">.</span></h1><div class="progress"><i style="width:${n/CHECKS.length*100}%"></i></div><div class="label">${n} / ${CHECKS.length} DONE</div></div>${CHECKS.map((c,i)=>`<label class="checkrow"><input type="checkbox" ${state.checks[c.id]?'checked':''} onchange="state.checks['${c.id}']=this.checked;save();renderCheck()"><span class="n">${pad(i+1)}</span><span class="txt">${esc(c.text)}</span></label>`).join('')}<p class="help">勾選狀態只存在這支手機的瀏覽器裡。</p>`}

/* more: ledger + notes + data */
function renderMore(){const total=state.expenses.reduce((a,e)=>a+Number(e.amount||0),0);
 const cats=CATS.map(c=>[c,state.expenses.filter(e=>e.category===c).reduce((a,e)=>a+Number(e.amount||0),0)]).filter(x=>x[1]);
 const ex=state.expenses.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 document.getElementById('page-more').innerHTML=`<div class="pagehead"><div class="label">EXPENSE LOG / JPY</div><h1>旅行帳本<span class="dot">.</span></h1></div>
 <div class="total">${yen(total)}</div>${cats.length?`<div class="cats">${cats.map(([c,v])=>`<span class="cat">${c} ${yen(v)}</span>`).join('')}</div>`:''}
 <button class="btn dark" style="width:100%" onclick="expenseModal()">＋ 記一筆支出</button>
 <div style="margin-top:6px">${ex.length?ex.map(e=>`<button class="row" onclick="expenseModal('${e.id}')"><span class="l">${esc(e.name)}<small>${esc(e.date||'')} · ${esc(e.category)}</small></span><span class="amt">${yen(e.amount)}</span></button>`).join(''):'<div class="empty">還沒有支出紀錄。</div>'}</div>
 <div class="section"><div class="section-title"><h2>田野筆記</h2><span class="label">NOTES</span></div>
 <button class="btn ghost" style="width:100%;margin-top:14px" onclick="noteModal()">＋ 新增觀察</button>
 ${state.notes.length?state.notes.slice().reverse().map(n=>`<button class="note" onclick="noteModal('${n.id}')">${esc(n.text)}<small>${esc(n.date)}</small></button>`).join(''):'<div class="empty">窗框、石頭的顏色、一句旅途中想到的話——都可以記在這裡。</div>'}</div>
 <div class="section"><div class="section-title"><h2>資料備份</h2><span class="label">BACKUP</span></div>
 <p class="help">所有紀錄只存在這支手機的瀏覽器，不會同步到其他裝置。建議旅程中偶爾匯出備份。</p>
 <div class="stack"><button class="btn ghost" onclick="exportJSON()">↓ 匯出備份 JSON</button><button class="btn ghost" onclick="document.getElementById('imp').click()">↑ 匯入備份</button><button class="btn ghost" onclick="exportCSV()">↓ 帳本匯出 CSV</button></div>
 <input id="imp" type="file" accept=".json,application/json" hidden onchange="importJSON(event)"></div>`}

function openModal(html,onSubmit){const f=document.getElementById('modal');f.innerHTML=html;f.onsubmit=e=>{e.preventDefault();onSubmit(new FormData(f))};document.getElementById('modalBg').classList.add('show');document.body.style.overflow='hidden'}
function closeModal(){document.getElementById('modalBg').classList.remove('show');document.body.style.overflow=''}
function expenseModal(id){const e=state.expenses.find(x=>x.id===id),d=new Date(),today=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
 openModal(`<h2>${e?'編輯支出':'記一筆支出'}<button type="button" onclick="closeModal()" aria-label="關閉">×</button></h2>
 <label class="fl">項目<input class="field" name="name" required value="${esc(e?.name)}" placeholder="例：東照宮門票"></label>
 <div class="grid2"><label class="fl">金額（日圓）<input class="field" name="amount" type="number" inputmode="numeric" min="0" required value="${esc(e?.amount??'')}"></label><label class="fl">類別<select class="field" name="category">${CATS.map(c=>`<option ${e?.category===c?'selected':''}>${c}</option>`).join('')}</select></label></div>
 <label class="fl">日期<input class="field" name="date" type="date" value="${esc(e?.date||(today>='2026-12-15'&&today<='2026-12-17'?today:'2026-12-15'))}"></label>
 <div class="btnrow">${e?`<button type="button" class="btn ghost" style="color:#a04d35;border-color:#a04d35" onclick="delExpense('${e.id}')">刪除</button>`:''}<button class="btn dark" type="submit">儲存</button></div>`,f=>{const amount=Number(f.get('amount'));if(!(amount>=0))return toast('請輸入有效金額');const item={id:e?.id||uid(),name:String(f.get('name')).trim(),amount,category:String(f.get('category')),date:String(f.get('date'))};if(e)Object.assign(e,item);else state.expenses.push(item);save();closeModal();renderMore();toast('帳本已更新')})}
function delExpense(id){if(!confirm('確定刪除這筆支出？'))return;state.expenses=state.expenses.filter(e=>e.id!==id);save();closeModal();renderMore()}
function noteModal(id){const n=state.notes.find(x=>x.id===id);
 openModal(`<h2>${n?'編輯筆記':'新增觀察'}<button type="button" onclick="closeModal()" aria-label="關閉">×</button></h2><label class="fl">內容<textarea class="field" name="text" rows="6" required placeholder="今天看見了什麼？">${esc(n?.text)}</textarea></label><label class="fl">標籤 / 日期<input class="field" name="date" value="${esc(n?.date||new Date().toLocaleDateString('zh-TW'))}"></label><div class="btnrow">${n?`<button type="button" class="btn ghost" style="color:#a04d35;border-color:#a04d35" onclick="delNote('${n.id}')">刪除</button>`:''}<button class="btn dark" type="submit">儲存</button></div>`,f=>{const item={id:n?.id||uid(),text:String(f.get('text')).trim(),date:String(f.get('date'))};if(!item.text)return;if(n)Object.assign(n,item);else state.notes.push(item);save();closeModal();renderMore();toast('筆記已儲存')})}
function delNote(id){if(!confirm('確定刪除這則筆記？'))return;state.notes=state.notes.filter(n=>n.id!==id);save();closeModal();renderMore()}
function download(name,content,type){const u=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500)}
function exportJSON(){download('utsunomiya-2026-backup.json',JSON.stringify(state,null,2),'application/json');toast('已匯出備份')}
function exportCSV(){const rows=[['日期','類別','項目','日圓'],...state.expenses.map(e=>[e.date,e.category,e.name,e.amount])];download('utsunomiya-2026-expenses.csv','﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('已匯出 CSV')}
async function importJSON(ev){const f=ev.target.files?.[0];if(!f)return;try{const s=JSON.parse(await f.text());if(!s||typeof s.done!=='object'||!Array.isArray(s.expenses)||!Array.isArray(s.notes))throw 0;if(!confirm('匯入會覆蓋目前資料，確定？'))return;s.checks=s.checks||{};state=s;save();renderMore();toast('已匯入備份')}catch(e){toast('檔案格式不正確')}finally{ev.target.value=''}}

document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const p=location.hash.slice(1)||'today';if(p==='today'||p==='route')render(p)}});
go(location.hash.slice(1)||'today');
</script>
</body>
</html>
